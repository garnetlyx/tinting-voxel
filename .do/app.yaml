name: tinting-voxel
services:
  - name: web
    dockerfile_path: /Dockerfile
    source_dir: /
    http_port: 8000
    instance_count: 1
    instance_size_slug: basic-xxs
    routes:
      - path: /
    envs:
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: CORS_ORIGINS
        value: https://your-app.example.com
    health_check:
      http_path: /api/health
